[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-services"
version = "0.3.1"
description = "Machine-discoverable, purchasable information services for agents"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=3.26,<4",
  "openai-agents==0.23.1",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "shapely>=2.1,<3",
  "mapbox-vector-tile>=2,<3",
  "pillow-heif>=1.8,<2",
  "PyJWT[crypto]>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8,<9"
]

[project.scripts]
agentic-services = "agentic_services.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_services"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
